services:

  api:
    build: .
    container_name: activity2a-api

    ports:
      - "5000:5000"

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: activity2a
      DB_USER: postgres
      DB_PASSWORD: postgres

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16

    container_name: activity2a-db

    environment:
      POSTGRES_DB: activity2a
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d activity2a"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data: