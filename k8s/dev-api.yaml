apiVersion: apps/v1
kind: Deployment
metadata:
  name: activity2a-api
  namespace: default
  labels:
    app: activity2a-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: activity2a-api
  template:
    metadata:
      labels:
        app: activity2a-api
    spec:
      serviceAccountName: activity2a-app
      containers:
        - name: api
          image: asia-south1-docker.pkg.dev/lunar-works-316500/devops-gcp-repo/activity-2a-api:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: DB_HOST
              value: "10.50.0.7"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: activity2a
            - name: DB_USER
              value: activity2a_user
            - name: GCP_PROJECT_ID
              value: lunar-works-316500
            - name: DB_PASSWORD_SECRET
              value: activity-2a-dev-postgres-password
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: activity2a-api
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: activity2a-api
  ports:
    - name: http
      port: 80
      targetPort: 5000
